<h2>Papato – VI-VIII secolo</h2>

<h3>593 - Conversione di Liutpranda</h3>
<p>
Papa Gregorio Magno riesce a convertire la regina dei Longobardi dall'arianesimo al cattolicesimo.
</p>

<h3>728 – Donazione di Sutri</h3>
<p>
Re Liutprando dona i territori di Sutri alla Chiesa, confermandone il potere temporale. L'Italia è spaccata in due.
</p>
